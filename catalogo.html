<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo — Nails Studio</title>
  <meta name="description" content="15 diseños reales de acrílico, gel y acripie. Filtra por técnica y usa cualquier diseño para calcular tu precio.">
  <link rel="canonical" href="https://dc-beauty.netlify.app/catalogo.html">
  <meta property="og:title" content="Catálogo — 15 diseños reales">
  <meta property="og:image" content="https://dc-beauty.netlify.app/fotos/SaveClip.App_491036120_18010025165732768_399971174939827291_n.jpg">
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <nav class="nav" aria-label="Principal">
    <div class="nav-inner">
      <a href="/index.html" class="nav-logo">Nails<span>.</span> Studio</a>
      <ul class="nav-links" role="list">
        <li><a class="nav-link" href="/catalogo.html">Catálogo</a></li>
        <li><a class="nav-link" href="/calculadora.html">Calculadora</a></li>
        <li><a class="nav-link" href="/agendar.html">Agendar</a></li>
      </ul>
      <a href="https://www.instagram.com/dc_beauty_04/" target="_blank" rel="noopener" class="nav-cta" aria-label="Instagram" style="width:40px;height:40px;border-radius:50%;border:1px solid var(--color-border);display:grid;place-items:center;color:var(--color-text-secondary)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
      <a href="https://maps.app.goo.gl/qezCBA5QgCTCMi9F9" target="_blank" rel="noopener" class="nav-cta" aria-label="Maps" style="width:40px;height:40px;border-radius:50%;border:1px solid var(--color-border);display:grid;place-items:center;color:var(--color-text-secondary)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></a>
      <a href="/agendar.html" class="btn btn-primary nav-cta">Reservar</a>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </nav>
  <div class="nav-mobile-menu"><ul class="nav-mobile-links"><li><a class="nav-mobile-link" href="/catalogo.html">Catálogo</a></li><li><a class="nav-mobile-link" href="/calculadora.html">Calculadora</a></li><li><a class="nav-mobile-link" href="/agendar.html">Agendar</a></li></ul><a href="/agendar.html" class="btn btn-primary nav-mobile-cta">Reservar cita</a></div>

  <main style="padding-top:calc(var(--nav-height) + var(--space-10))">
    <div class="container">
      <div class="section-header">
        <h1 class="section-title">Catálogo</h1>
        <p class="section-subtitle">Filtra por técnica, color u ocasión. Cada diseño precarga la calculadora.</p>
      </div>

      <div class="catalog-filters" role="group" aria-label="Filtros">
        <button class="filter-btn active" data-filter="todos">Todos (15)</button>
        <button class="filter-btn" data-filter="Acrílico">Acrílico</button>
        <button class="filter-btn" data-filter="Gel semipermanente manos">Gel manos</button>
        <button class="filter-btn" data-filter="Acripie">Acripie</button>
        <button class="filter-btn" data-filter="Baño de acrílico">Baño acrílico</button>
        <button class="filter-btn" data-filter="Pies gel">Pies gel</button>
        <button class="filter-btn" data-filter="fiesta">Fiesta</button>
        <button class="filter-btn" data-filter="diario">Diario</button>
      </div>

      <div style="display:flex; gap:var(--space-3); justify-content:center; margin-bottom:var(--space-6)">
        <input id="search" class="input-field" style="max-width:360px" placeholder="Buscar por nombre..." aria-label="Buscar">
      </div>

      <div id="grid" class="catalog-grid" aria-live="polite"></div>
      <div id="empty" class="empty-state" style="display:none">
        <div class="empty-state-icon">🔍</div>
        <div class="empty-state-title">Sin resultados</div>
        <p class="empty-state-description">Prueba con otros filtros o limpia la búsqueda.</p>
        <button id="clear-filters" class="btn btn-secondary">Limpiar filtros</button>
      </div>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Navegación móvil"><div class="bottom-nav-inner"><a href="/index.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Inicio</a><a href="/catalogo.html" class="bottom-nav-item active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Diseños</a><a href="/calculadora.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Precio</a><a href="/agendar.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Cita</a></div></nav>
  <div data-footer></div>

  <script type="module">
    import { initNav } from '/js/components/nav.js';
    import { renderFooter } from '/js/components/footer.js';
    import { fetchCatalog } from '/js/data.js';
    import { formatPrice, saveCalcSelection } from '/js/utils.js';
    initNav('catalogo');
    renderFooter();

    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const search = document.getElementById('search');
    const filterBtns = document.querySelectorAll('.filter-btn');
    let items = await fetchCatalog();
    let activeFilter = 'todos';

    function render() {
      const q = search.value.toLowerCase().trim();
      let filtered = items.filter(it => {
        const matchesSearch = !q || it.nombre.toLowerCase().includes(q);
        const matchesFilter = activeFilter==='todos' || it.tecnica===activeFilter || it.color===activeFilter || it.ocasion===activeFilter;
        return matchesSearch && matchesFilter;
      });
      if (!filtered.length) {
        grid.innerHTML=''; empty.style.display='flex'; return;
      }
      empty.style.display='none';
      grid.innerHTML = filtered.map(it => `
        <article class="catalog-card">
          <img class="catalog-card-image" src="${it.imagen_url}" alt="${it.nombre}" loading="lazy">
          <div class="catalog-card-overlay" style="opacity:1">
            <div class="catalog-card-info" style="transform:none">
              <div class="catalog-card-name">${it.nombre}</div>
              <div class="catalog-card-technique">${it.tecnica} · ${it.color}</div>
              <div class="catalog-card-price">Desde ${formatPrice(it.precio_desde)}</div>
              <button class="btn btn-primary btn-sm catalog-card-btn" data-id="${it.id}">Usar este diseño</button>
            </div>
          </div>
        </article>
      `).join('');
      grid.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const it = filtered.find(x=>x.id===btn.dataset.id);
          saveCalcSelection({ tecnica: it.tecnica, color: it.color, catalogId: it.id, catalogName: it.nombre });
          location.href='calculadora.html';
        });
      });
    }

    filterBtns.forEach(b=>{
      b.addEventListener('click', ()=>{
        filterBtns.forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        activeFilter = b.dataset.filter;
        render();
      });
    });
    search.addEventListener('input', render);
    document.getElementById('clear-filters').onclick = ()=>{
      activeFilter='todos'; search.value=''; filterBtns.forEach(x=>x.classList.remove('active')); filterBtns[0].classList.add('active'); render();
    };

    if (!items.length) {
      grid.innerHTML='';
      empty.style.display='flex';
      empty.querySelector('.empty-state-title').textContent='Catálogo vacío';
      empty.querySelector('.empty-state-description').textContent='Aún no hay diseños. El admin puede agregarlos desde /admin.';
      document.getElementById('clear-filters').style.display='none';
    } else render();
  </script>
</body>
</html>
